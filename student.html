<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Performance Prediction</h2>

    <label>Attendance (%)</label>
    <input type="number" id="attendance" min="0" max="100">

    <label>Study Hours per Day</label>
    <input type="number" id="study" min="0">

    <label>Assignment Marks (%)</label>
    <input type="number" id="assignment" min="0" max="100">

    <label>Previous Exam Marks (%)</label>
    <input type="number" id="previous" min="0" max="100">

    <button onclick="predictPerformance()">Predict Performance</button>

    <div id="result"></div>

</div>

<script>
function predictPerformance() {

    let attendance = Number(document.getElementById("attendance").value);
    let study = Number(document.getElementById("study").value);
    let assignment = Number(document.getElementById("assignment").value);
    let previous = Number(document.getElementById("previous").value);

    // Simple calculation
    let score =
        (attendance * 0.20) +
        (study * 5) +
        (assignment * 0.30) +
        (previous * 0.25);

    let result = document.getElementById("result");

    if (score >= 75) {
        result.innerHTML = "Prediction: Excellent Performance";
    }
    else if (score >= 50) {
        result.innerHTML = "Prediction: Average Performance";
    }
    else {
        result.innerHTML = "Prediction: Needs Improvement";
    }
}
</script>

</body>
</html>
